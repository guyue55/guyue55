name: Generate Snake Animation

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Generate Snake Animation (light theme - github palette + purple snake)
        uses: Platane/snk@v3
        with:
          github_user_name: guyue55
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github&color_snake=purple
            dist/github-contribution-grid-snake.gif?palette=github&color_snake=purple
          
      - name: Generate Snake Animation (dark theme - github-dark palette + purple snake)
        uses: Platane/snk@v3
        with:
          github_user_name: guyue55
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=purple
            dist/github-contribution-grid-snake-dark.gif?palette=github-dark&color_snake=purple
          
      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/
          git diff --cached --quiet || git commit -m "Update snake animation $(date +'%Y-%m-%d')"
          git push
