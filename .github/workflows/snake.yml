name: Generate Snake Animation

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    
    steps:
      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: guyue55
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#00ff00
            dist/github-contribution-grid-snake.gif?palette=github-dark&color_snake=#00ff00
          
      - name: Push Changes
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/
          git diff --cached --quiet || git commit -m "Update snake animation $(date +'%Y-%m-%d')"
          git push
